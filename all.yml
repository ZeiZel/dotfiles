---
- name: Install dotfiles
  hosts: local
  gather_facts: true
  pre_tasks:
    - name: Load Darwin variables
      ansible.builtin.include_vars:
        file: group_vars/darwin.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: always
    - name: Load Linux variables
      ansible.builtin.include_vars:
        file: group_vars/linux.yml
      when: ansible_facts['os_family'] != "Darwin"
      tags: always
  roles:
    - role: macos
      when: ansible_facts['os_family'] == "Darwin"
      tags: macos
    - role: linux
      when: ansible_facts['os_family'] != "Darwin"
      tags: linux
    - role: homebrew
      tags: homebrew
    - role: dotfiles
      tags: dotfiles
    - role: git
      tags: git
    - role: node
      tags: node
    - role: docker
      tags: docker
    - role: claude
      tags: claude
    - role: ai
      when: ai_rag_enabled | default(false) | bool
      tags: ai
