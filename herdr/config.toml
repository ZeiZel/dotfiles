# Herdr is an optional manual workspace UI. Tmux + Workmux are the primary
# terminal workspace; this configuration remains available for explicit use.
onboarding = false

[theme]
name = "catppuccin"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Keep the long-standing Tmux muscle memory. Press Ctrl+A twice to send a
# literal Ctrl+A to the program in the focused pane.
prefix = "ctrl+a"

# Ctrl+A, g is reserved for Lazygit below, so keep the session navigator on f.
goto = "prefix+f"
reload_config = "prefix+alt+r"
previous_workspace = "prefix+left"
next_workspace = "prefix+right"

[[keys.command]]
key = "prefix+g"
type = "popup"
# The Homebrew launch service inherits macOS's minimal PATH. Keep this command
# portable across Apple Silicon, Intel macOS and Linuxbrew.
command = 'export PATH="/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:$PATH"; exec lazygit'
description = "Lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle reviewr"

[ui]
sidebar_width = 28
sidebar_min_width = 20
sidebar_max_width = 38
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
mouse_capture = true
copy_on_select = true
redraw_on_focus_gained = true
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 2

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
pane_history = false
switch_ascii_input_source_in_prefix = true

[advanced]
scrollback_limit_bytes = 10000000
