---
# Docker installation (macOS + Linux)

- name: Installing Docker on macOS
  when: ansible_facts['os_family'] == "Darwin"
  block:
    - name: Check if Docker is already installed
      ansible.builtin.command:
        cmd: docker --version
      register: docker_installed
      changed_when: false
      failed_when: false
      environment:
        PATH: /usr/local/bin:/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}

    - name: Check if Docker Desktop app exists
      ansible.builtin.stat:
        path: /Applications/Docker.app
      register: docker_app

    - name: Docker installation skipped (already installed)
      ansible.builtin.debug:
        msg: "Docker is already installed (version: {{ docker_installed.stdout | default('Docker.app found') }})"
      when: docker_installed.rc == 0 or docker_app.stat.exists

    - name: Check if Docker CLI is available after install
      ansible.builtin.command:
        cmd: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      environment:
        PATH: /usr/local/bin:/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}

    - name: Notify user to start or repair Docker Desktop
      ansible.builtin.debug:
        msg: >
          Docker Desktop is declared in Brewfile. Start it from Applications
          to complete setup, or rerun the Homebrew role if Docker.app is
          missing. No docker group configuration is needed on macOS.
      when: docker_check.rc != 0

- name: Installing Docker on Linux
  become: true
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"]
  block:
    - name: Installing additional packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-debian
          - python3-pip
        update_cache: true
        cache_valid_time: 86400
    - name: Creating keyrings for APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Add Docker signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Configure the stable Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - >-
            {{ docker_debian_architectures.get(
              ansible_facts['architecture'],
              ansible_facts['architecture']
            ) }}
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Installing Docker-ce and Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
        state: present
    - name: Checking Docker started
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

- name: Setting additional packages python (Linux only)
  become: true
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"]
  block:
    - name: Install pip packages for Ansible Docker modules
      ansible.builtin.pip:
        name: [docker>=6.0.0, requests>=2.20.0]
        state: present

- name: Docker post-install (Linux only)
  become: true
  when: ansible_facts['distribution'] in ["Ubuntu", "Debian"]
  block:
    - name: Adding user in Docker group
      ansible.builtin.user:
        name: '{{ dotfiles_user }}'
        groups: docker
        append: true
    - name: Explain Docker group activation
      ansible.builtin.debug:
        msg: >-
          Docker group membership is configured. Log out and back in before
          running Docker without sudo; the playbook never reboots the host.

- name: Report unsupported Linux Docker distribution
  ansible.builtin.debug:
    msg: >-
      Automatic Docker Engine installation currently supports Ubuntu and
      Debian only. Install Docker for {{ ansible_facts['distribution'] }}
      using the vendor instructions.
  when:
    - ansible_facts['os_family'] != "Darwin"
    - ansible_facts['distribution'] not in ["Ubuntu", "Debian"]
