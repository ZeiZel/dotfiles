---
# Dotfiles symlinks management via stow

# Create required directories
- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ config_dir }}"
    state: directory
    mode: "0755"

- name: Create AeroSpace config directory
  ansible.builtin.file:
    path: "{{ config_dir }}/aerospace"
    state: directory
    mode: "0755"

- name: Create cache directories for zsh tools
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_home }}/.cache/atuin"
    - "{{ dotfiles_home }}/.cache/zoxide"
    - "{{ dotfiles_home }}/.cache/navi"
    - "{{ dotfiles_home }}/.cache/broot"
    - "{{ dotfiles_home }}/.cache/fzf"
    - "{{ dotfiles_home }}/.cache/starship"
    - "{{ dotfiles_home }}/.cache/zsh"

# Remove only links that resolve to this repository's tmux files. Regular
# files and links owned by another checkout are never removed before Stow.
- name: Inspect existing tmux configuration entries
  ansible.builtin.stat:
    path: "{{ config_dir }}/tmux/{{ item }}"
    follow: false
  loop: "{{ dotfiles_tmux_config_files }}"
  register: dotfiles_tmux_config_stats
  changed_when: false

- name: Resolve repository candidates among tmux symlinks
  ansible.builtin.command:
    argv:
      - realpath
      - "{{ config_dir }}/tmux/{{ item.item }}"
  loop: "{{ dotfiles_tmux_config_stats.results }}"
  when: item.stat.islnk | default(false)
  register: dotfiles_tmux_config_realpaths
  check_mode: false
  changed_when: false
  failed_when: false

- name: Collect repository-owned tmux symlinks
  ansible.builtin.set_fact:
    dotfiles_owned_tmux_links: "{{ (dotfiles_owned_tmux_links | default([])) + [item.item.item] }}"
  loop: "{{ dotfiles_tmux_config_realpaths.results | default([]) }}"
  when:
    - (item.rc | default(1)) == 0
    - (item.stdout | default('')) == (configs_path ~ '/tmux/' ~ item.item.item)

- name: Remove repository-owned tmux symlinks before Stow
  ansible.builtin.file:
    path: "{{ config_dir }}/tmux/{{ item }}"
    state: absent
  loop: "{{ dotfiles_owned_tmux_links | default([]) }}"

# Preview the Stow plan during an Ansible dry run. Using --stow here detects
# additions and conflicts without the unlink/relink noise produced by --restow.
# In check mode the preceding file tasks are simulated, so omit only the tmux
# package when an owned legacy link would otherwise still appear as a conflict.
- name: Preview stow links
  ansible.builtin.command:
    cmd: >-
      stow --simulate --stow --no-folding --verbose=1
      {{ '--ignore=tmux' if (dotfiles_owned_tmux_links | default([]) | length > 0) else '' }} .
    chdir: "{{ configs_path }}"
  register: dotfiles_stow_preview
  check_mode: false
  changed_when: >-
    'LINK:' in dotfiles_stow_preview.stdout
    or
    'LINK:' in dotfiles_stow_preview.stderr
  when: ansible_check_mode

# Restow removes links for deleted files and refreshes the complete managed
# tree. It always unlinks/relinks existing entries, so the task is a real host
# mutation even when the resulting link targets are unchanged.
- name: Restow managed configuration
  ansible.builtin.command:
    cmd: stow --restow --no-folding .
    chdir: "{{ configs_path }}"
  changed_when: true
  when: not ansible_check_mode

# Install TPM after the config is deployed. The pinned commit makes fresh-host
# provisioning reproducible, while existing plugin and resurrect data remain.
- name: Provision pinned Tmux Plugin Manager
  ansible.builtin.git:
    repo: "{{ dotfiles_tmux_tpm_repo }}"
    dest: "{{ dotfiles_tmux_tpm_path }}"
    version: "{{ dotfiles_tmux_tpm_ref }}"
    update: true
  when: not ansible_check_mode

- name: Install declared Tmux plugins through TPM
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_tmux_tpm_path }}/bin/install_plugins"
  environment:
    TMUX_PLUGIN_MANAGER_PATH: "{{ config_dir }}/tmux/plugins"
  register: dotfiles_tmux_plugin_install
  when: not ansible_check_mode
  changed_when: >-
    'Installing' in (dotfiles_tmux_plugin_install.stdout ~ dotfiles_tmux_plugin_install.stderr)
    or 'Cloning' in (dotfiles_tmux_plugin_install.stdout ~ dotfiles_tmux_plugin_install.stderr)
  failed_when: dotfiles_tmux_plugin_install.rc != 0

- name: Ensure native Resterm config directory on macOS
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/Library/Application Support/resterm"
    state: directory
    mode: "0755"
  when: ansible_facts['system'] == "Darwin"

- name: Link Resterm bindings into native macOS config
  ansible.builtin.file:
    src: "{{ config_dir }}/resterm/bindings.toml"
    dest: "{{ dotfiles_home }}/Library/Application Support/resterm/bindings.toml"
    state: link
    force: true
  when: ansible_facts['system'] == "Darwin"

# Additional symlinks (home directory)
- name: Create .zshrc symlink in home
  ansible.builtin.file:
    src: "{{ config_dir }}/zsh/.zshrc"
    dest: "{{ dotfiles_home }}/.zshrc"
    state: link
    force: true

- name: Create .gitconfig symlink in home
  ansible.builtin.file:
    src: "{{ config_dir }}/git/.gitconfig"
    dest: "{{ dotfiles_home }}/.gitconfig"
    state: link
    force: true

- name: Create .gitignore_global symlink in home
  ansible.builtin.file:
    src: "{{ config_dir }}/git/.gitignore_global"
    dest: "{{ dotfiles_home }}/.gitignore_global"
    state: link
    force: true

- name: Inspect installed Herdr plugins
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - list
      - --json
  environment:
    PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  register: dotfiles_herdr_plugin_inventory
  check_mode: false
  changed_when: false

- name: Select the installed reviewr plugin record
  ansible.builtin.set_fact:
    dotfiles_herdr_reviewr_plugins: >-
      {{
        (
          (dotfiles_herdr_plugin_inventory.stdout | from_json).result.plugins
          | selectattr('plugin_id', 'equalto', dotfiles_herdr_reviewr_id)
          | list
        )
      }}

- name: Remove a mismatched reviewr plugin version
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - uninstall
      - "{{ dotfiles_herdr_reviewr_id }}"
  environment:
    PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  when:
    - dotfiles_herdr_reviewr_plugins | length > 0
    - >-
      (dotfiles_herdr_reviewr_plugins | first).version != dotfiles_herdr_reviewr_version
      or
      ((dotfiles_herdr_reviewr_plugins | first).source.requested_ref | default(''))
      != dotfiles_herdr_reviewr_ref
      or
      ((dotfiles_herdr_reviewr_plugins | first).source.resolved_commit | default(''))
      != dotfiles_herdr_reviewr_ref
  changed_when: true

- name: Install the pinned reviewr plugin
  ansible.builtin.command:
    argv:
      - herdr
      - plugin
      - install
      - "{{ dotfiles_herdr_reviewr_source }}"
      - --ref
      - "{{ dotfiles_herdr_reviewr_ref }}"
      - --yes
  environment:
    PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  when: >-
    dotfiles_herdr_reviewr_plugins | length == 0
    or
    (dotfiles_herdr_reviewr_plugins | first).version != dotfiles_herdr_reviewr_version
    or
    ((dotfiles_herdr_reviewr_plugins | first).source.requested_ref | default(''))
    != dotfiles_herdr_reviewr_ref
    or
    ((dotfiles_herdr_reviewr_plugins | first).source.resolved_commit | default(''))
    != dotfiles_herdr_reviewr_ref
  changed_when: true

- name: Manage the Herdr user service on macOS
  when: ansible_facts['system'] == "Darwin"
  block:
    - name: Inspect the Herdr user service
      ansible.builtin.command:
        argv:
          - brew
          - services
          - info
          - herdr
          - --json
      environment:
        PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
      register: dotfiles_herdr_service
      check_mode: false
      changed_when: false

    - name: Start Herdr now and at user login
      ansible.builtin.command:
        argv:
          - brew
          - services
          - start
          - herdr
      environment:
        PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
      when: >-
        not (
          (dotfiles_herdr_service.stdout | from_json | first).registered
          and
          (dotfiles_herdr_service.stdout | from_json | first).running
        )
      changed_when: true

- name: Inspect Herdr agent integrations
  ansible.builtin.command:
    argv:
      - herdr
      - integration
      - status
  environment:
    PATH: "{{ dotfiles_home }}/.local/bin:{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  register: dotfiles_herdr_integration_status
  check_mode: false
  changed_when: false

- name: Locate supported local coding agents
  ansible.builtin.command:
    argv:
      - which
      - "{{ item }}"
  environment:
    PATH: "{{ dotfiles_home }}/.local/bin:{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotfiles_herdr_integrations }}"
  loop_control:
    label: "{{ item }}"
  register: dotfiles_herdr_agent_commands
  check_mode: false
  changed_when: false
  failed_when: false

- name: Install current Herdr integrations for available coding agents
  ansible.builtin.command:
    argv:
      - herdr
      - integration
      - install
      - "{{ item.item }}"
  environment:
    PATH: "{{ dotfiles_home }}/.local/bin:{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dotfiles_herdr_agent_commands.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc == 0
    - "(item.item ~ ': current') not in dotfiles_herdr_integration_status.stdout"
  changed_when: true
