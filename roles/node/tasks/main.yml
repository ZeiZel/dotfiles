---
# Node.js and npm packages installation

- name: Install nvm
  ansible.builtin.git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    version: "{{ node_nvm_version }}"
    depth: 1
    update: true

- name: Install or update Node LTS
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      nvm install --lts
    executable: /bin/bash
  register: node_lts_install
  changed_when: >-
    'is already installed' not in
    (node_lts_install.stdout + node_lts_install.stderr)

- name: Use the current Node LTS release as the default
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.nvm/alias/default"
    content: "lts/*\n"
    mode: "0644"

- name: Resolve the default Node LTS executable
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      nvm which default
    executable: /bin/bash
  register: node_default_executable
  changed_when: false

- name: Install pinned global npm developer tools
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
    executable: "{{ node_default_executable.stdout | dirname }}/npm"
  environment:
    PATH: "{{ node_default_executable.stdout | dirname }}:{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ node_npm_global_packages }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"

# AI pair programming tools
- name: Inspect uv-managed tools
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/uv tool list"
  environment:
    PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  register: node_uv_tools
  changed_when: false

- name: Install aider via uv
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/uv tool install aider-chat"
  environment:
    PATH: "{{ homebrew_bin }}:{{ ansible_facts['env']['PATH'] }}"
  when: node_uv_tools.stdout is not search('(?m)^aider-chat\s')
  changed_when: true
