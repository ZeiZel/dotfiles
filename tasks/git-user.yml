---
# Git user configuration with persistent caching
# Prompts once, caches to ~/.dotfiles-cache/git-user.yml for future runs

- name: Ensure dotfiles cache directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.dotfiles-cache"
    state: directory
    mode: "0700"

- name: Check for cached git user data
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.dotfiles-cache/git-user.yml"
  register: git_user_cache

- name: Load cached git user data
  ansible.builtin.include_vars:
    file: "{{ dotfiles_home }}/.dotfiles-cache/git-user.yml"
  when: git_user_cache.stat.exists

- name: Prompt for git user name
  ansible.builtin.pause:
    prompt: "Enter your Git user name (e.g. John Doe)"
  register: git_name_prompt
  when: git_user_name is not defined

- name: Prompt for git user email
  ansible.builtin.pause:
    prompt: "Enter your Git email"
  register: git_email_prompt
  when: git_user_email is not defined

- name: Prompt for GitHub username
  ansible.builtin.pause:
    prompt: "Enter your GitHub username"
  register: github_user_prompt
  when: github_user is not defined

- name: Set git user facts from prompts
  ansible.builtin.set_fact:
    git_user_name: "{{ git_name_prompt.user_input }}"
    git_user_email: "{{ git_email_prompt.user_input }}"
    github_user: "{{ github_user_prompt.user_input }}"
  when: git_user_name is not defined

- name: Cache git user data for future runs
  ansible.builtin.copy:
    content: |
      ---
      git_user_name: "{{ git_user_name }}"
      git_user_email: "{{ git_user_email }}"
      github_user: "{{ github_user }}"
    dest: "{{ dotfiles_home }}/.dotfiles-cache/git-user.yml"
    mode: "0600"
  when: not git_user_cache.stat.exists

- name: Generate ~/.gitconfig.local from template
  ansible.builtin.template:
    src: templates/gitconfig.local.j2
    dest: "{{ dotfiles_home }}/.gitconfig.local"
    mode: "0644"
