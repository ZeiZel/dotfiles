---
# Node.js and npm packages installation

- name: install nvm
  ansible.builtin.shell:
    cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
    creates: '{{ ansible_facts.env.HOME }}/.nvm/nvm.sh'
  register: nvm_status

- name: install node lts
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      nvm install --lts
      nvm alias default node
    executable: /bin/bash
  args:
    creates: '{{ ansible_facts.env.HOME }}/.nvm/versions/node'

- name: install global npm packages (without claude)
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      npm install -g @beads/bd @gastown/gt nx@latest @nestjs/cli@latest @angular/cli@latest repomix@latest
    executable: /bin/bash
  register: npm_global_install
  changed_when: "'added' in npm_global_install.stdout"

# Claude Code native binary installation
# Native binary: ~/.local/bin/claude -> ~/.local/share/claude/versions/<ver>
# NOT native: ~/.bun/bin/claude (bun global package) or nvm node bin

- name: check if native claude binary exists
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/claude"
  register: native_claude_stat

- name: update native claude binary
  ansible.builtin.command:
    cmd: "{{ ansible_facts.env.HOME }}/.local/bin/claude update"
  when: native_claude_stat.stat.exists
  register: claude_update
  changed_when: "'Updated' in claude_update.stdout"
  failed_when: false

- name: install native claude binary (bootstrap via npm)
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      npm install -g @anthropic-ai/claude-code@latest
      claude install
    executable: /bin/bash
  when: not native_claude_stat.stat.exists

- name: remove npm/bun claude packages (direct rm, no npm uninstall)
  ansible.builtin.shell:
    cmd: |
      # Remove from all nvm node versions
      for dir in ~/.nvm/versions/node/*/lib/node_modules/@anthropic-ai/claude-code; do
        [ -d "$dir" ] || continue
        node_dir="${dir%%/lib/node_modules*}"
        rm -rf "$dir"
        rm -f "$node_dir/bin/claude"
        echo "removed nvm: $node_dir"
      done
      # Remove bun global package (not the native binary)
      if [ -d ~/.bun/install/global/node_modules/@anthropic-ai/claude-code ]; then
        rm -rf ~/.bun/install/global/node_modules/@anthropic-ai/claude-code
        rm -f ~/.bun/bin/claude
        echo "removed bun claude"
      fi
    executable: /bin/bash
  register: pkg_claude_cleanup
  changed_when: "'removed' in pkg_claude_cleanup.stdout"

- name: display claude installation status
  ansible.builtin.debug:
    msg: "Claude Code native binary: {{ ansible_facts.env.HOME }}/.local/bin/claude"

# AI pair programming tools
- name: install aider (AI pair programming)
  ansible.builtin.shell:
    cmd: |
      pip3 install --user aider-chat --break-system-packages || pip3 install --user aider-chat
    executable: /bin/bash
  register: aider_install
  changed_when: "'Successfully installed' in aider_install.stdout"
  ignore_errors: true
