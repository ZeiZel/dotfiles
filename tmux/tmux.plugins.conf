# ============================================
# TMUX PLUGINS
# ============================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Agents
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Utils
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'laktak/extrakto'

# ============================================
# PLUGIN CONFIGURATIONS
# ============================================

# Resurrect - save/restore sessions
# Pane contents are captured so a restored pane keeps its scrollback: for an
# agent pane that transcript is the only part of its state that survives.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3 btop btm bottom lazygit lazydocker k9s nvim vim yazi broot jless lnav glow'
set -g @resurrect-dir '~/.config/tmux/resurrect'
# Saves are frequent here, and resurrect keeps every file for this many days
# while always retaining the five newest.
set -g @resurrect-delete-backup-after '7'

# Agent CLIs are deliberately not restarted on restore: their panes come back
# in the right directory with their transcript intact, but relaunching a dozen
# agents at once is an expensive and surprising thing to do automatically. To
# opt in, append to the list above, for example:
#   "~claude->claude --continue" "~codex->codex resume --last"

# Continuum - auto save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# Boot stays off: continuum's macOS boot support opens Terminal.app, iTerm,
# kitty or Alacritty, and has no Ghostty strategy. The server surviving every
# client is handled by exit-empty in tmux.options.conf instead.
set -g @continuum-boot 'off'

# Continuum only saves on its interval timer, so detaching or closing the
# terminal can lose everything since the last tick. These hooks save at the two
# moments a session is most likely to end. The session-closed hook checks that
# something is left to save, otherwise closing the last session would overwrite
# a good snapshot with an empty one.
set-hook -g client-detached[50] \
  'run-shell -b "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g session-closed[50] \
  'run-shell -b "if [ \"$(tmux list-sessions 2>/dev/null | wc -l)\" -gt 0 ]; then ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet; fi"'

# SessionX - session manager
set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/projects,~/.dotfiles,~/.config'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
# Catppuccin Mocha colors for SessionX
set -g @sessionx-fzf-opts '--color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#f5e0dc,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8'

# Agent sidebar - Claude Code / Codex / OpenCode panes across all sessions.
# Upstream defaults to `e` and `E`; `e` already belongs to extrakto here and
# `E` is tmux's own select-layout -E, so the toggles move to `a` for agent.
set -g @sidebar_key 'a'
set -g @sidebar_key_all 'A'
set -g @sidebar_width '34'
set -g @sidebar_position 'right'

# FZF URL - open URLs with fzf
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="  " --border-label=" Open URL " --color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#f5e0dc,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8'
set -g @fzf-url-history-limit '2000'

# Tmux-FZF
set -g @tmux-fzf-launch-key 'F'
TMUX_FZF_LAUNCH_KEY="F"
TMUX_FZF_OPTIONS="-p -w 75% -h 75% --color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#f5e0dc,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8"

# Thumbs - quick copy with hints
set -g @thumbs-key 'T'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'
set -g @thumbs-bg-color '#1e1e2e'
set -g @thumbs-fg-color '#cba6f7'
set -g @thumbs-hint-bg-color '#1e1e2e'
set -g @thumbs-hint-fg-color '#f38ba8'
set -g @thumbs-select-bg-color '#1e1e2e'
set -g @thumbs-select-fg-color '#a6e3a1'

# Extrakto - fuzzy search pane content
set -g @extrakto_key 'e'
set -g @extrakto_split_direction 'p'
set -g @extrakto_split_size '15'
set -g @extrakto_fzf_tool 'fzf'
set -g @extrakto_copy_key 'tab'
set -g @extrakto_insert_key 'enter'
